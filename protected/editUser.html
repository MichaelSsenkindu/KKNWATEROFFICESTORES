<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT USER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="viewUsers">
<h1>Available Users</h1>
<div id="usersList"></div>
</div>
    <script>
     function viewUsers(){ 
const usersList=document.getElementById('usersList')
usersList.innerHTML=''
fetch('/users/viewUsers',{
    method:'get'
})
.then(res=>res.json())
.then(data=>{
    if(data.success){
        data.users.forEach((user,i) => {
            const li=document.createElement('li')
            const edit=document.createElement('button')
            edit.textContent='EDIT'
            edit.style.background='green'
            li.textContent=`${1+i}.${user.username}-----${user.role}` 
            usersList.appendChild(li) 
            li.appendChild(edit) 
            edit.onclick=()=>{
                editUser(user._id,user)
            }
        });
    }
})
  }
  viewUsers()
  function editUser(id,user){
  const username=prompt('Enter New username',user.username)
  const role=prompt('Enter Role',user.role)
  if(!username || !role){
    return alert('both fields are required')
  }
  fetch('/users/editUser/'+ id,{
    method:'put',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:username,role:role
    })
  }).then(res=>res.json())
  .then(data=>{
    if(data.success){
alert(data.message)
viewUsers()
    }else{
      return alert(data.message)
    }
  })
}
    
</script>
  <script src="/script.js"></script>  
</body>
</html>
