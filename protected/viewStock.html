<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="availableStock" style="position: fixed;top: 20px;">
    <h2 style="text-align: center;">Available stock</h2>
    <div id="availableStock" class="availableStock"></div>
    </div>
   <script>

    function viewStock(){

  const stockList=document.getElementById('availableStock')
  stockList.innerHTML=''
  fetch('/stocks/viewStock',{
    method:'get'
  }).then(res=>res.json())
  .then(data=>{
    if(data.success){
      console.log(data)
data.availableStocks.forEach((availableStock,i) => {
    const li=document.createElement('li')
    li.textContent=`${1+i}.${availableStock.materialName}-${availableStock.materialSize} Total ${availableStock.quantity}`
    stockList.appendChild(li)
  });
    }else{return alert('no Stock found')}
   
  })
  
}
viewStock()
   </script>

  <!-- <script src="/script.js"></script> -->
</body>
</html>
