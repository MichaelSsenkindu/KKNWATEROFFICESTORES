<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISABLE USER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="viewUsers">
<h1>User Lists</h1>
<div id="usersList"></div>
</div>
<script>
    function viewUsers(){ 
const usersList=document.getElementById('usersList')
usersList.innerHTML=''
fetch('/users/viewUsers',{
    method:'get'
})
.then(res=>res.json())
.then(data=>{
    if(data.success){
        data.users.forEach((user,i) => {
            const li=document.createElement('li')
            const disableUsers=document.createElement('button')

disableUsers.textContent = user.active ? 'Disable' : 'Enable'
disableUsers.style.background = user.active ? 'red' : 'blue'
            li.textContent=`${1+i}.${user.username}-----${user.role}` 
            usersList.appendChild(li)  
            li.appendChild(disableUsers)
            disableUsers.onclick=()=>{
              
                disableUser(user._id,disableUsers)
            }
        });
    }
})
  }
  viewUsers()


  function disableUser(id){
   
   fetch('/users/disableUser/'+id,{
    method:'put'
   })
   .then(res=>res.json())
   .then(data=>{
if(data.success){
alert(data.message)
// disableUsers.textContent='Enable'
// disableUsers.textContent = data.active ? 'Disable' : 'Enable'
// disableUsers.style.background = data.active ? 'red' : 'blue'
viewUsers()
   }
   })
}


    

</script>
    <script src="/script.js"></script>
</body>
</html>
