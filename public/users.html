<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USERS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="addUsers">
    <h1>Add User</h1>
    <form id="addUser">
<input type="text" id="username" placeholder="Enter Username" autocomplete="off" required><br><br>
<select id="role" required>
    <option value="">Select Officer Role</option>
    <option value="Technical Supervisor">Technical Supervisor</option>
    <option value="Plumber">Plumber</option>
    <option value="Operations Manager">Operations Manager</option>
    <option value="Commercial Officer">Commercial Officer</option>
    <option value="Office Attendant">Office Attendant</option>
    <option value="Pump Attendant">Pump Attendant</option>
    <option value="Security Guard">Security Guard</option>
</select><br><br>
<input type="password" id="password" placeholder="Enter User Password" required><br><br>
<button type="submit">Add User</button>
    </form>
 
<script>
    // add user
const addUser=document.getElementById('addUser')
if(addUser){
  addUser.addEventListener('submit',(e)=>{
    e.preventDefault()
  const username=document.getElementById('username').value.toLowerCase().trim()
  const role=document.getElementById('role').value
  const password=document.getElementById('password').value
  if(!username || !role || !password){
    return alert('All fields are required')
  }
 fetch('/addUser',{
    method:'post',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:username,role:role,password:password})
  }).then(res=>res.json())
  .then(data=>{
    if(data.success){
      alert('user added successsfully')
      document.getElementById('username').value=''
      document.getElementById('role').value=''
      document.getElementById('password').value=''
      setTimeout(() => {
        window.location='dashboard.html'
      }, 2000);
    }else{ 
      alert(data.message)
          return
        }
  }).catch(error=>{
    console.log(error)
    return
  })
})
}

const addUserRole=document.getElementById('addUser')
const userRole=localStorage.getItem('role')
if(userRole !=='Admin'){
  addUserRole.style.pointerEvents='none'
  addUserRole.style.opacity=0.5
}
</script>
 <!-- <script src="script.js"></script> -->
</body>
</html>
