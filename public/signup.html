<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form id="signupForm">
        <h1>Welcome to KKN store</h1>
        <h2 id="signupMsg">Please Signup</h2>
<label for="username">Username:</label>
<input type="text" name="username" id="username" placeholder="Enter your Username" autocomplete="off"><br><br>
<select id="role" class="role" required>
    <option value="">Select Officer Role</option>
    <option value="Technical Supervisor">Technical Supervisor</option>
    <option value="Plumber">Plumber</option>
    <option value="Commercial Officer">Commercial Officer</option>
    <option value="Office Attendant">Office Attendant</option>
    <option value="Pump Attendant">Pump Attendant</option>
    <option value="Security Guard">Security Guard</option>
</select><br><br>
<label for="password">Password:</label>
<input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="off"> <br><br>
<button type="submit">Signup</button><br><br>
<p>Already have account? <a href="login.html">Login</a></p>

    </form>
   <script src="script.js"></script>

</body>
</html>
