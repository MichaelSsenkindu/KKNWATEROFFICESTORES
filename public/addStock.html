<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADD STOCK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="addStockContainer" id="addStockContainer">
    <h2>Add Materials</h2>

<label for="connector">Material Name:</label>
<select id="materialName">
    <option value="">Select Material Name</option>
    <option value="Connector">Connector</option>
    <option value="Pipe">Pipe</option>
</select>
<hr>
<label for="size">Material Size:</label>
<select id="materialSize">
    <option value="">Select Material Size</option>
    <option value="OD20mm">OD20mm</option>
    <option value="OD25mm">OD25mm</option>
    <option value="OD32mm">OD32mm</option>
    <option value="OD40mm">OD40mm</option>
    <option value="OD50mm">OD50mm</option>
    <option value="OD63mm">OD63mm</option>
    <option value="OD75mm">OD75mm</option>
    <option value="OD90mm">OD90mm</option>
    <option value="OD110mm">OD110mm</option>
    <option value="OD160mm">OD160mm</option>
</select>
<hr>
<label for="type">Material Type:</label>
<select id="materialType">
    <option value="">Select Material Type</option>
    <option value="HDPE">HDPE</option>
    <option value="GI">GI</option>
    <option value="PVC">PVC</option>
</select>
<hr>
<label for="quantity">Quantity:</label>
<input type="number" id="quantity" name="quantity" placeholder="Enter Quantity" required>
<hr>
<label for="date">Received On:</label>
<input type="date" id="date">
<hr>
<button onclick="addStock()">Add Stock</button>
</div>
   <script>
    // add stock
function addStock(){
 
const materialName=document.getElementById('materialName').value
const materialSize=document.getElementById('materialSize').value
const materialType=document.getElementById('materialType').value
const quantity=document.getElementById('quantity').value
const date=document.getElementById('date').value
if(!materialName || !materialSize || !materialType || !quantity || !date){
  return alert('All fields are required...!')
}
fetch('/addStock',{
  method:'post',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    materialName:materialName,
    materialSize:materialSize,
    materialType:materialType,
    quantity:quantity,
    date:date
  })
})
.then(res=>res.json())
.then(data=>{
  if(data.success){
    alert('Stock added successfully')
 document.getElementById('materialName').value=''
 document.getElementById('materialSize').value=''
 document.getElementById('materialType').value=''
 document.getElementById('quantity').value=''
 document.getElementById('date').value=''
  setTimeout(() => {
        window.location='dashboard.html'
      }, 2000);
  }else{
    return alert('Failed to add Stock please try again......')
  }
}).catch(error=>{
  console.log(error)
  return 
})

}
const addUserRole=document.getElementById('addStockContainer')
const userRole=localStorage.getItem('role')
if(userRole !=='Admin' && userRole !=='Operations Manager'){
  addUserRole.style.pointerEvents='none'
  addUserRole.style.opacity=0.5
}
   </script> 
</body>
</html>
